[package]
name = "mal-compiler"
version.workspace = true
edition.workspace = true
description = "Compiler for the mal language"
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "malc"
path = "src/main.rs"

[[bench]]
name = "pipeline"
harness = false

[dependencies]
mal-backend = { path = "../mal-backend" }
mal-frontend = { path = "../mal-frontend" }
mal-syntax = { path = "../mal-syntax" }

[dev-dependencies]
mal-fmt = { path = "../mal-fmt" }

[lints]
workspace = true
